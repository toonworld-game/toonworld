name: Toonworld macOS V166
on:
  push:
    paths: ['.github/workflows/macos-v166.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare packaging sources
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,base64
          p=pathlib.Path('app/main.cjs');p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(''))
          p=pathlib.Path('make-assets.py');p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(''))
          p=pathlib.Path('package.json');p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(''))
          p=pathlib.Path('LISEZ-MOI.txt');p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(''))
          PY
      - name: Fetch pinned V166 without changes
        run: |
          curl --fail --location --retry 2 https://github.com/toonworld-game/toonworld/releases/download/v166/toonworld.html -o app/toonworld.html
          echo '26f9f0a60ac73f575014a52eb16421f591f8653a0b964a7651d9ee449026635f  app/toonworld.html' | shasum -a 256 -c -
      - name: Create original logo and installer artwork
        run: |
          python3 -m venv .venv
          .venv/bin/pip install pillow==12.0.0
          .venv/bin/python make-assets.py
      - name: Build universal DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --mac dmg --universal --publish never
      - name: Mount, inspect and install test copy
        run: |
          mkdir -p evidence
          hdiutil verify dist/Toonworld-V166-macOS-universal.dmg | tee evidence/dmg-verify.txt
          hdiutil attach dist/Toonworld-V166-macOS-universal.dmg -nobrowse -mountpoint /Volumes/ToonworldTest
          test -d /Volumes/ToonworldTest/Toonworld.app
          test -L /Volumes/ToonworldTest/Applications
          test "$(readlink /Volumes/ToonworldTest/Applications)" = /Applications
          ditto /Volumes/ToonworldTest/Toonworld.app /Applications/Toonworld.app
          lipo -archs /Applications/Toonworld.app/Contents/MacOS/Toonworld | tee evidence/architectures.txt
          codesign --verify --deep --strict --verbose=2 /Applications/Toonworld.app 2>&1 | tee evidence/codesign.txt
          codesign -dvv /Applications/Toonworld.app 2>&1 | tee evidence/signature.txt
          spctl --assess --type execute --verbose=4 /Applications/Toonworld.app > evidence/gatekeeper.txt 2>&1 || true
          open /Volumes/ToonworldTest
          sleep 4
          screencapture -x evidence/03-finder-installation.png || true
      - name: Launch installed app and load Manhattan
        run: |
          /Applications/Toonworld.app/Contents/MacOS/Toonworld --toonworld-smoke="$PWD/evidence" > evidence/launch.log 2>&1
          cat evidence/smoke.json
          test -s evidence/01-menu.png
          test -s evidence/02-game.png
      - name: Verify bundled game hash
        run: |
          node - <<'JS'
          const asar=require('@electron/asar');
          const fs=require('node:fs');const crypto=require('node:crypto');
          const data=asar.extractFile('/Applications/Toonworld.app/Contents/Resources/app.asar','app/toonworld.html');
          const hash=crypto.createHash('sha256').update(data).digest('hex');
          if(hash!=='26f9f0a60ac73f575014a52eb16421f591f8653a0b964a7651d9ee449026635f')throw Error('Source changed');
          fs.writeFileSync('evidence/bundled-source.txt',hash+' '+data.length+' bytes\n');
          JS
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macOS-V166-verification
          path: evidence/
          retention-days: 7
      - name: Publish tested package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp assets/icon.png dist/Toonworld-logo.png
          cp LISEZ-MOI.txt dist/LISEZ-MOI.txt
          cd dist
          shasum -a 256 Toonworld-V166-macOS-universal.dmg Toonworld-logo.png LISEZ-MOI.txt > SHA256SUMS.txt
          gh release create v166-macos-1 --title 'Toonworld V166 pour macOS' --notes-file LISEZ-MOI.txt --prerelease Toonworld-V166-macOS-universal.dmg Toonworld-logo.png LISEZ-MOI.txt SHA256SUMS.txt
