name: Toonworld published macOS controls
on:
  push:
    paths: ['.github/workflows/macos-controls.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controls:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download exact published DMG and install test copy
        run: |
          mkdir -p evidence
          curl --fail --location --retry 2 https://github.com/toonworld-game/toonworld/releases/download/v166-macos-2/Toonworld-V166-macOS-universal.dmg -o Toonworld.dmg
          echo '42f8b4addb5eecb9fa74d2aa087825ec3a193631b5c0859862989d0093b1de56  Toonworld.dmg' | shasum -a 256 -c - | tee evidence/hash.txt
          hdiutil attach Toonworld.dmg -nobrowse -mountpoint /Volumes/ToonworldTest
          ditto /Volumes/ToonworldTest/Toonworld.app /Applications/Toonworld.app
      - name: Test actual package commands without editing game
        run: |
          python3 - <<'PY'
          import base64,pathlib
          pathlib.Path('controls.cjs').write_bytes(base64.b64decode(''))
          PY
          /Applications/Toonworld.app/Contents/MacOS/Toonworld --remote-debugging-port=9222 > evidence/launch.log 2>&1 &
          node controls.cjs
      - name: Preserve controls evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-macOS-controls
          path: evidence/
          retention-days: 7
