name: Toonworld Windows V166
'on':
  push:
    paths:
    - .github/workflows/windows-v166.yml
  workflow_dispatch: null
permissions:
  contents: write
jobs:
  build-install-test:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Prepare Windows packaging
      shell: python
      run: 'import pathlib,base64

        p=pathlib.Path(''app/main.cjs'');p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(''''))

        p=pathlib.Path(''package.json'');p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(''''))

        p=pathlib.Path(''make-assets.py'');p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(''''))

        p=pathlib.Path(''LISEZ-MOI.txt'');p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(''''))

        '
    - name: Fetch pinned game and approved logo
      shell: pwsh
      run: 'New-Item evidence -ItemType Directory -Force

        curl.exe --fail --location --retry 2 https://github.com/toonworld-game/toonworld/releases/download/v166/toonworld.html -o app/toonworld.html

        if ($LASTEXITCODE -ne 0) { throw ''Game download failed'' }

        if ((Get-FileHash app/toonworld.html -Algorithm SHA256).Hash.ToLower() -ne ''26f9f0a60ac73f575014a52eb16421f591f8653a0b964a7651d9ee449026635f'') { throw ''Game hash mismatch'' }

        curl.exe --fail --location --retry 2 https://github.com/toonworld-game/toonworld/releases/download/v166-macos-2/Toonworld-logo.png -o logo.png

        if ($LASTEXITCODE -ne 0) { throw ''Logo download failed'' }

        if ((Get-FileHash logo.png -Algorithm SHA256).Hash.ToLower() -ne ''91d991daff7d75d511ed99586fd2b85497ad0e3d6652d9f46987e10f99addec4'') { throw ''Logo hash mismatch'' }

        '
    - name: Create Windows icon and installer artwork
      run: 'python -m pip install pillow==12.0.0

        python make-assets.py'
    - name: Build real x64 Windows installer
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      run: 'npm install --no-audit --no-fund

        npx electron-builder --win nsis --x64 --publish never'
    - name: Observe installer, install and launch real EXE
      shell: pwsh
      run: "Add-Type -AssemblyName System.Windows.Forms\nAdd-Type -AssemblyName System.Drawing\nfunction Screenshot($name) {\n $bounds=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds\n $bmp=New-Object System.Drawing.Bitmap($bounds.Width,$bounds.Height)\n $g=[System.Drawing.Graphics]::FromImage($bmp)\n $g.CopyFromScreen($bounds.Location,[System.Drawing.Point]::Empty,$bounds.Size)\n $bmp.Save((Join-Path $PWD \"evidence/$name\"))\n $g.Dispose();$bmp.Dispose()\n}\n$p=Start-Process \"$PWD/dist/toonworld.exe\" -PassThru\nStart-Sleep 8\nScreenshot '00-installer.png'\nStop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue\nGet-Process | Where-Object {$_.ProcessName -like '*toonworld*' -or $_.ProcessName -like '*ns*tmp*'} | Stop-Process -Force -ErrorAction SilentlyContinue\nStart-Sleep 2\n$p=Start-Process \"$PWD/dist/toonworld.exe\" -ArgumentList '/S','/currentuser','/D=C:\\ToonworldTest' -Wait -PassThru\nif ($p.ExitCode -ne 0) { throw \"Installer exit $($p.ExitCode)\" }\nif (!(Test-Path 'C:\\ToonworldTest\\Toonworld.exe')) { throw 'Installed app missing' }\nGet-AuthenticodeSignature dist/toonworld.exe | Select-Object Status,StatusMessage | ConvertTo-Json | Out-File evidence/signature.json\nGet-ComputerInfo | Select-Object WindowsProductName,WindowsVersion,OsArchitecture | ConvertTo-Json | Out-File evidence/windows.json\nGet-ChildItem \"$env:USERPROFILE/Desktop\",\"$env:APPDATA/Microsoft/Windows/Start Menu/Programs\" -Recurse -Filter '*Toonworld*' | Select-Object Name,FullName | ConvertTo-Json | Out-File evidence/shortcuts.json\n$p=Start-Process 'C:\\ToonworldTest\\Toonworld.exe' -ArgumentList \"--toonworld-smoke=$PWD/evidence\" -PassThru\nif (!$p.WaitForExit(360000)) { Stop-Process -Id $p.Id -Force; throw 'Installed app test timeout' }\nif ($p.ExitCode -ne 0) { throw \"Installed app exit $($p.ExitCode)\" }\nGet-Content evidence/smoke.json\n"
    - name: Verify installed game bytes
      shell: pwsh
      run: '@''

        const asar=require(''@electron/asar''),fs=require(''fs''),crypto=require(''crypto'');

        const b=asar.extractFile(''C:/ToonworldTest/resources/app.asar'',''app/toonworld.html'');

        const h=crypto.createHash(''sha256'').update(b).digest(''hex'');

        if(h!==''26f9f0a60ac73f575014a52eb16421f591f8653a0b964a7651d9ee449026635f'')throw Error(''Bundled source changed'');

        fs.writeFileSync(''evidence/bundled-source.txt'',h+'' ''+b.length+'' bytes\n'');

        ''@ | node

        '
    - name: Upload Windows verification evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Windows-V166-verification
        path: evidence/
        retention-days: 7
    - name: Publish tested Windows installer
      env:
        GH_TOKEN: ${{ github.token }}
      shell: pwsh
      run: 'Copy-Item LISEZ-MOI.txt dist/LISEZ-MOI.txt

        Get-FileHash dist/toonworld.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  toonworld.exe" } | Out-File dist/SHA256SUMS.txt -Encoding ascii

        Compress-Archive -Path evidence/* -DestinationPath dist/Windows-verification.zip

        cd dist

        gh release create v166-windows --title ''Toonworld V166 pour Windows'' --notes-file LISEZ-MOI.txt --prerelease toonworld.exe LISEZ-MOI.txt SHA256SUMS.txt Windows-verification.zip

        '
