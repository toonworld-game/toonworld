name: Toonworld published Windows controls
'on':
  push:
    paths:
    - .github/workflows/windows-controls.yml
  workflow_dispatch: null
permissions:
  contents: write
jobs:
  controls:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Download and install exact published EXE
      shell: pwsh
      run: 'New-Item evidence -ItemType Directory -Force

        curl.exe -fL https://github.com/toonworld-game/toonworld/releases/download/v166-windows/toonworld.exe -o toonworld.exe

        if ($LASTEXITCODE -ne 0) {throw ''Download failed''}

        if ((Get-FileHash toonworld.exe -Algorithm SHA256).Hash.ToLower() -ne ''d6cc5ae86e6b44a5084b618ab6bc458a9e60e45d654bb0a6ad93c842802df105'') {throw ''EXE hash mismatch''}

        $p=Start-Process "$PWD/toonworld.exe" -ArgumentList ''/S'',''/currentuser'',''/D=C:\ToonworldTest'' -Wait -PassThru

        if ($p.ExitCode -ne 0) {throw ''Install failed''}

        '
    - name: Test published app commands without editing game
      shell: pwsh
      run: '[IO.File]::WriteAllBytes("$PWD/controls.cjs",[Convert]::FromBase64String(''''))

        $p=Start-Process ''C:\ToonworldTest\Toonworld.exe'' -ArgumentList ''--remote-debugging-port=9222'' -PassThru

        node controls.cjs

        if ($LASTEXITCODE -ne 0) {throw ''Control test failed''}

        Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

        '
    - name: Upload controls evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Windows-published-controls
        path: evidence/
        retention-days: 7
    - name: Attach controls evidence to release
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      shell: pwsh
      run: 'Compress-Archive -Path evidence/* -DestinationPath Windows-controls.zip

        gh release upload v166-windows Windows-controls.zip --clobber

        '
